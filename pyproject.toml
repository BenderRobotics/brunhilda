[project]
name = "brunhilda"
description = "Bender Robotics System Test Runner"
dynamic = ["version"]
authors = [
    { name = "Pavel Kumpan", email = "kumpan@benderrobotics.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.7"
keywords = []
dependencies = [
    'Jinja2>=2.10.3',
    'numpy>=1.17.3',
    'ddt>=1.2.2',
    'colorama>=0.4.1',
    'docutils>=0.15.2',
    'Pillow>=7.2.0',
    'pyyaml',
    'simplejson>=3.17.6',
    'natsort>=8.1.0',
    'tqdm>=4.67.3',
]
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
homepage = "https://www.benderrobotics.com"
repository = "https://github.com/BenderRobotics/brunhilda"
issues = "https://github.com/BenderRobotics/brunhilda/issues"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "bs4",
]
dev = [
    "mypy",
    "yapf",
    "numpy",
    "lorem",
]
doorstop-user-stories = [
    "doorstop==2.2.1"
]


[build-system]
requires = ["setuptools>=45", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"


# Tooling

[tool.setuptools.package-data]
"*" = ["templates/*.jinja2", "templates/themes/*.css"]

[tool.setuptools_scm]
write_to = "src/brunhilda/__version__.py"
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"


[tool.yapf]
based_on_style="google"
column_limit=120
split_before_logical_operator=true
continuation_align_style="SPACE"
dedent_closing_brackets=true


[tool.mypy]
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
show_error_codes = true
junit_xml = "report-mypy.xml"
exclude = ["venv"]
ignore_missing_imports = true


[tool.isort]
# isort configuration:
# https://github.com/timothycrosley/isort/wiki/isort-Settings
include_trailing_comma = true
use_parentheses = true
skip_gitignore = true
# See https://github.com/timothycrosley/isort#multi-line-output-modes
multi_line_output = 3
line_length = 120


[tool.pytest.ini_options]
# Directories that are not visited by pytest collector:
norecursedirs = ["*.egg", ".eggs", "dist", "build", "docs", ".tox", ".git", "__pycache__",]


[tool.coverage.run]
branch = true
source = ["src"]
omit = [
    "test/*",
    "**/venv/**",
]
parallel = true
data_file = ".coverage_html/coverage_data"

[tool.coverage.report]
# Regexes for lines to exclude from consideration
show_missing = true
exclude_lines = [
    # Have to re-enable the standard pragma
    "pragma: no cover",

    # Don't complain about missing debug-only code:
    "def __repr__",
    # Don't complain if tests don't hit defensive assertion code:
    "raise AssertionError",
    "raise NotImplementedError",
    "pass",

    # Don't complain on un-testable lines
    "except ImportError:",

    # Don't complain about type checking
    "if TYPE_CHECKING:",

    # Don't complain if non-runnable code isn't run:
    "if __name__ == .__main__.:",

    # Ignore abstract methods
    "@abstract",
]
ignore_errors = true
precision = 2

[tool.coverage.html]
directory = "htmlcov"
