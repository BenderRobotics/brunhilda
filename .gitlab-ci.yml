stages:
  - 🦄 quality
  - 🕵️ test
  - 📈 stats
  - 🔨 build
  - 🚀 deploy

variables:
  PACKAGE_REGISTRY: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/brunhilda"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"


.test:
  stage: 🕵️ test
  image: python:$PYTHON_VERSION
  tags: [docker]
  cache:
    key: ${CI_JOB_NAME}-${PYTHON_VERSION}
    paths:
      - .cache/pip
      - .mypy_cache
      - venv/
  before_script:
    - pip install virtualenv
    - virtualenv venv
    - source venv/bin/activate
    - pip install -e .\[test] --index-url https://pypi.benderrobotics.com:443/simple/

pre-commit:
  image: registry.benderrobotics.com/br/toolchains/pre-commit:2.17.0
  stage: 🦄 quality
  tags: [docker]
  script:
    - pre-commit run --all-files --show-diff-on-failure

test-unit:
  stage: 🕵️ test
  extends: .test
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.13"]
  artifacts:
    expire_in: 1 day
    paths:
      - htmlcov/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml
  script:
    - pytest test/unit --pyargs --tb=short --cov=. --cov-config=.coveragerc --cov-report xml:coverage.xml --cov-report html:htmlcov --cov-report term --junitxml=report.xml
  coverage: /^TOTAL.+?\s(\d+\.?\d*\%)$/

build:
  stage: 🔨 build
  image: python:3.9
  tags:
    - docker
  artifacts:
    paths:
      - dist
    expire_in: 1 day
    reports:
      dotenv: variables.env
  before_script:
    - pip install build
  script:
    - mkdir dist
    - python -m build --sdist --wheel --outdir $CI_PROJECT_DIR/dist .
    - PACKAGE_NAME=$(cd dist && ls *.whl | head -1)
    - ARCHIVE_NAME=$(cd dist && ls *.tar.gz | head -1)
    - VERSION=$(python -c "import build.util; print(build.util.project_wheel_metadata('.').get('Version'))")
    - echo "Version = ${VERSION}"
    - echo "PACKAGE_NAME=${PACKAGE_NAME}" >> variables.env
    - echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> variables.env
    - echo "VERSION=${VERSION}" >> "$CI_PROJECT_DIR/variables.env"

prepare-release:
  image: python:3.9
  stage: 🔨 build
  tags:
    - docker
  needs:
    - build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - python tools/get_changes.py CHANGELOG.md v${VERSION} > changes.txt
  artifacts:
    paths:
      - "changes.txt"
    expire_in: 1 days

release-wheel:
  stage: 🚀 deploy
  needs:
    - build
  tags:
    - docker
  image: chartedcode/alpine-sftp-client
  before_script:
    - echo "$PYPI_KEY" | tr -d '\r' > ./ssh_key
    - chmod 600 ./ssh_key
  script:
    - TAG_VERSION=${CI_COMMIT_TAG#"v"}
    - |
      sftp -i ./ssh_key -oStrictHostKeyChecking=no $PYPI_USER@$PYPI_HOST:/brunhilda/ << EOF
        put dist/*
        quit
      EOF
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+.*$/

package-registry-upload:
  stage: 🚀 deploy
  needs: [build]
  image: curlimages/curl:latest
  tags:
    - docker
  script:
    - TAG_VERSION=${CI_COMMIT_TAG#"v"}
    - test $VERSION = $TAG_VERSION
    - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "dist/${PACKAGE_NAME}" "${PACKAGE_REGISTRY}/${VERSION}/${PACKAGE_NAME}"'
    - 'curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "dist/${ARCHIVE_NAME}" "${PACKAGE_REGISTRY}/${VERSION}/${ARCHIVE_NAME}"'
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

release-gitlab:
  stage: 🚀 deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - docker
  needs: [build, prepare-release]
  script:
    - TAG_VERSION=${CI_COMMIT_TAG#"v"}
    - test $VERSION = $TAG_VERSION
    - DESCRIPTION=$(cat changes.txt)
    - |
      release-cli create --name "Release of BRunhilda $CI_COMMIT_TITLE" --tag-name $CI_COMMIT_TAG \
        --description "$DESCRIPTION" \
        --assets-link "{\"name\":\"${PACKAGE_NAME}\",\"url\":\"${PACKAGE_REGISTRY}/${VERSION}/${PACKAGE_NAME}\"}" \
        --assets-link "{\"name\":\"${ARCHIVE_NAME}\",\"url\":\"${PACKAGE_REGISTRY}/${VERSION}/${ARCHIVE_NAME}\"}"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
