- case: Test_G03_EnergyData
  comment: ''
  description: "\n\n        The test verifies correct availability of the energy metering\
    \ modes in relation to the system\n        configuration.\n\n        "
  level: visual
  requirements:
  - MMI_PGF_L14_4.3
  result: PASSED
  steps:
  - comment: ''
    description: '             Enable and gradually go to all screens of type SCREEN_ENERGY_DATA.'
    expectation: '            '
    number: 1
    obtained: ''
    result: ''
  - comment: ''
    description: '             Read out the value ranges of the parameters that control
      availability of the energy metering modes from the MMI.'
    expectation: '            '
    number: 2
    obtained: ''
    result: ''
  - comment: ''
    description: |2-
                   Set combination of parameters controlling availability of the energy metering modes.

                   +--------------------+-------------------------------------------------------------------------------------------------------+
                   | **Operation mode** | **Available**                                                                                         |
                   +====================+=======================================================================================================+
                   | | Space heating    | | [system_type] = 2 or 3                                                                              |
                   +--------------------+-------------------------------------------------------------------------------------------------------+
                   | | Space cooling    | | [system_type] = 1 or 3                                                                              |
                   +--------------------+-------------------------------------------------------------------------------------------------------+
                   | | DHW              | | [DHW] = 1 and ([DHW_tank] = 1 or ([unit_type] = 6 and [Boiler_brand] = NDJ))                        |
                   +--------------------+-------------------------------------------------------------------------------------------------------+
                   | | Tank             | | [tank_heat_total].applicability                                                                     |
                   |                    |   ([model_type] = 2 and (([ext heat source_changeable] = 2 or 3) or [solar] = 2))                     |
                   +--------------------+-------------------------------------------------------------------------------------------------------+
                   | | Sum              | | [system_type] = 3 or ([DHW] = 1 and ([DHW_tank] = 1 or ([unit_type] = 6 and [Boiler_brand] = NDJ))) |
                   +--------------------+-------------------------------------------------------------------------------------------------------+
    expectation: '            '
    number: 3
    obtained: ''
    result: ''
  - comment: ''
    description: |2-
                   Refresh the screen, capture the image of the currently displayed screen
                   and compare expected mode with displayed one.
    expectation: '             Displayed mode matches with the expected one.'
    number: 4
    obtained: ''
    result: ''
  - comment: ''
    description: '             Rotate right dial to the right to check if another
      mode is available according to current system configuration.'
    expectation: '            '
    number: 5
    obtained: ''
    result: ''
  - comment: ''
    description: '             After last mode verification, capture the image of
      the currently displayed screen.'
    expectation: '             Displayed mode is the same as the last one.'
    number: 6
    obtained: ''
    result: ''
  tags:
    covering:
    - ''
    disabled-modules:
    - P1P2
    environment:
    - ENV_VIS_MMI1
    - ENV_VIS_MMI2
    exec-time:
    - ''
    execution:
    - automatic
    maintainer:
    - Pavel Kumpan
    name:
    - Energy metering modes
    priority:
    - mid
    spec:
    - MMI_PGF_L14_4.3
    status:
    - ''
    test-id:
    - ''
    variants:
    - ''
  test_id: Test_G03_EnergyData.test_01_availability_of_modes
